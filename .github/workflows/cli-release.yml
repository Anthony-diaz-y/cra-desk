name: CLI release

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Test
        working-directory: cli
        run: |
          go vet ./...
          go test ./...
      - name: Build binaries
        run: VERSION="${GITHUB_REF_NAME#cli-v}" bash scripts/build-cli.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cli/dist/* --title "cradesk ${GITHUB_REF_NAME#cli-v}" --generate-notes
