spring:
  application:
    name: cra-desk-api
  datasource:
    # Local defaults match docker-compose.yml; in production these come from env vars.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cradesk}
    username: ${DATABASE_USER:cradesk}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  web:
    # API messages always in English, regardless of the server or client locale
    locale: en
    locale-resolver: fixed
  mvc:
    # Spring's own errors (malformed JSON, wrong method, ...) also as RFC 9457 problem details
    problemdetails:
      enabled: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
