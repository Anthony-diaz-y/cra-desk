spring:
  application:
    name: cra-desk-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cradesk}
    username: ${DATABASE_USER:cradesk}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
  web:
    locale: en
    locale-resolver: fixed
  flyway:
    enabled: true

server:
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

cradesk:
  admin:
    token: ${CRADESK_ADMIN_TOKEN:}
  demo:
    enabled: ${CRADESK_DEMO_ENABLED:true}
  sbom:
    max-bytes: ${CRADESK_SBOM_MAX_BYTES:5242880}
  osv:
    base-url: ${CRADESK_OSV_BASE_URL:https://api.osv.dev}

management:
  endpoints:
    web:
      exposure:
        include: health
