spring:
  application:
    name: cra-desk-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cradesk}
    username: ${DATABASE_USER:cradesk}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  web:
    locale: en
    locale-resolver: fixed
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
